[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
platform = "linux"
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
files = ["scmanager"]
